name:  Kubernetes CI/CD

on:
  push:
    branches:
      - k8s-upgrade   #  Runs only for your Kubernetes branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1 — Checkout your repo
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2 — Login to Docker Hub
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # Step 3 — Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/realcode:latest .

      # Step 4 — Push to Docker Hub
      - name: Push to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/realcode:latest

      # Step 5 — Deploy to EC2 Kubernetes (Master Node)
      - name: Deploy to Kubernetes on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/terraform-docker-aws-project/k8s
            kubectl apply -f deployment.yaml
            kubectl apply -f service.yaml